<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Container Tab Groups — Options</title>
    <style>
      body {
        font: menu;
        font-size: 13px;
        margin: 1rem;
        max-width: 32rem;
      }
      label {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        margin: 0.75rem 0;
      }
      p.hint {
        margin: 0.15rem 0 0 1.6rem;
        color: GrayText;
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="groupDefaultContainer" />
      <span>Also group tabs with no container</span>
    </label>
    <p class="hint">
      Puts tabs opened outside any Multi-Account Container into a
      "No Container" group.
    </p>

    <label>
      <input type="checkbox" id="syncTitleAndColor" />
      <span>Keep group name and colour matched to the container</span>
    </label>
    <p class="hint">
      When off, groups are created once and then left alone for you to rename.
    </p>

    <script src="options.js"></script>
  </body>
</html>
